# Gradle properties — performance tuning for AdFastDismiss
# ============================================================

# JVM memory — prevents OutOfMemory during Kotlin compilation
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC

# Parallel builds — faster compilation on multi-core machines
org.gradle.parallel=true

# Gradle daemon — reuse JVM between builds (much faster subsequent builds)
org.gradle.daemon=true

# Configuration cache — cache build configuration (Gradle 8+)
org.gradle.configuration-cache=false

# Android-specific
android.useAndroidX=true
android.enableJetifier=false

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.caching.enabled=true
